
<!DOCTYPE html>
<html>

<head>
    <style>
        * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: sans-serif;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background-color: #0f172a;
}

/* Horizontal Row Settings */
.cardFAQcontainerH {
  display: flex;
    flex-direction: column;
  gap: 15px;
  width: 90%;
  max-width: 900px;
  height: 400px;
}

/* Individual Card Defaults */
.toggleFAQcard {
  flex: 1; /* Equal initial widths */
  background-color: #1e293b;
  border-radius: 16px;
  color: #fff;
  cursor: pointer;
  overflow: hidden;
  position: relative;
  transition: flex 0.6s cubic-bezier(0.25, 1, 0.5, 1), background-color 0.3s;
}

.toggleFAQcard:hover {
  background-color: #334155;
}

/* Expanded Card Width State */
.toggleFAQcard.active {
  flex: 3; /* Expands to three times the base size */
  background-color: #3b82f6;
}

/* Content Layout Alignment */
.cardFAQcontent {
  position: absolute;
  bottom: 20px;
  left: 20px;
  right: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.cardFAQcontent h2 {
  font-size: 2.5rem;
  opacity: 0.3;
}

.cardFAQcontent h3 {
  font-size: 1.5rem;
  white-space: nowrap;
}

/* Hide descriptions inside collapsed cards */
.cardFAQcontent p {
  font-size: 0.95rem;
  line-height: 1.4;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.3s ease, transform 0.4s ease;
}

/* Fade in description text after card expands */
.toggleFAQcard.active .cardFAQcontent p {
  opacity: 1;
  transform: translateY(0);
  transition-delay: 0.3s;
}

    </style>
</head>
<body>



<div class="cardFAQcontainerH">
  <!-- Card 1 -->
  <div class="toggleFAQcard active">
    <div class="cardFAQcontent">
      <h2>01</h2>
      <h3>Web Design</h3>
      <p>Create stunning, highly responsive user interfaces tailored for modern devices.</p>
    </div>
  </div>

  <!-- Card 2 -->
  <div class="toggleFAQcard">
    <div class="cardFAQcontent">
      <h2>02</h2>
      <h3>Development</h3>
      <p>Build scalable, robust backends and clean architectures using modern stacks.</p>
    </div>
  </div>

  <!-- Card 3 -->
  <div class="toggleFAQcard">
    <div class="cardFAQcontent">
      <h2>03</h2>
      <h3>SEO Strategy</h3>
      <p>Optimize visibility, track key analytics, and rank higher on search engines.</p>
    </div>
  </div>
</div>

</body>
<script>
    // Target all toggle cards in the document
const cards = document.querySelectorAll('.toggleFAQcard');

cards.forEach(card => {
  card.addEventListener('click', () => {
    // Terminate early if the card is already expanded
    if (card.classList.contains('active')) return;

    // Remove active status from all other cards
    cards.forEach(c => c.classList.remove('active'));

    // Apply active status to the selected card
    card.classList.add('active');
  });
});

</script>
</html>
