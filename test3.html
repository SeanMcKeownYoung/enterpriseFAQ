<style>
    /* Container styling */
.scroll-navbar {
  display: flex;                 /* Aligns items in a single row */
  overflow-x: scroll;              /* Enables horizontal scrolling when content overflows */
  overflow-y: hidden;             /* Prevents accidental vertical shifting */
  white-space: nowrap;           /* Keeps links strictly on one line */
  background-color: #1a1a1a;     /* Dark background color */
  padding: 10px 15px;            /* Padding inside the navbar */
  box-sizing: border-box;
  width: 100%;                   /* Spans the full screen width */
  
  /* Smooth momentum scrolling on mobile devices */
  -webkit-overflow-scrolling: touch; 
}

/* Individual link styling */
.nav-item {
  display: inline-block;
  color: #ffffff;
  text-decoration: none;
  padding: 8px 16px;
  margin-right: 8px;
  font-family: sans-serif;
  font-size: 14px;
  border-radius: 20px;
  background-color: #333333;
  transition: background-color 0.2s ease;
}

/* Hover and active states */
.nav-item:hover {
  background-color: #555555;
}

.nav-item.active {
  background-color: #007bff;     /* Highlights the current active page */
}

/* Optional: Hide the scrollbar visual element for a cleaner appearance */
.scroll-navbar::-webkit-scrollbar {
  display: none;                 /* Works for Safari, Chrome, and Opera */
}

.scroll-navbar {
  scrollbar-width: none;         /* Works for Firefox */
}

</style>

<nav class="scroll-navbar">
  <a href="#home" class="nav-item active">Home</a>
  <a href="#trending" class="nav-item">Trending Now</a>
  <a href="#technology" class="nav-item">Technology</a>

  <a href="#movies" class="nav-item">Movies & TV</a>
  <a href="#sports" class="nav-item">Sports News</a>
  <a href="#fashion" class="nav-item">Fashion & Style</a>
  <a href="#lifestyle" class="nav-item">Lifestyle</a>
  <a href="#finance" class="nav-item">Personal Finance</a>
</nav>
