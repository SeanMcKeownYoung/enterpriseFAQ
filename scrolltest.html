




<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Page Title</title>
    <!-- Link external CSS stylesheet here -->
<style>
    /* Container layout */
.hero-section {
  position: relative;
  height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
}

/* Background image placement */
.hero-section::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-image: url('images/magGlassWorked.png');
  background-size: cover;
  background-position: center;
  z-index: -1;
  
  /* Link the animation to the scroll timeline */
  animation: scaleAndMove linear both;
  animation-timeline: scroll(root); /* tracks the main window scroll */
  animation-range: exit;            /* animates while the element exits the view */
}

/* Keyframes mapped to scroll position */
@keyframes scaleAndMove {
  from {
    /* Starting state: default scale and centered */
    transform: scale(1) translateY(0);
  }
  to {
    /* Ending state: scales up by 30% and shifts downward */
    transform: scale(1.3) translateY(100px);
  }
}

/* Extra content to make the page scrollable */
.content-section {
  height: 100vh;
  background: #111;
  color: #fff;
  padding: 40px;
}

</style>
</head>
<body>

    <header>
        <h1>Welcome to My Website</h1>
    </header>

<div class="scroll-container">
  <div class="hero-section">
    <h1>Scroll Down</h1>
  </div>
  <div class="content-section">
    <p>Keep scrolling to see the background transform.</p>
  </div>
</div>

    <footer>
        <p>&copy; 2026 Your Name</p>
    </footer>

</body>
</html>
