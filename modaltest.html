<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure CSS Modals</title>
    <style>
        /* Trigger Button Styles */
        .btnFAQcontainer {
            display: flex;
            gap: 20px;
            padding: 50px;
        }
        .modalFAQtrigger {
            display: inline-block;
            padding: 12px 24px;
            background-color: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            font-family: sans-serif;
            font-weight: bold;
        }
        .modalFAQtrigger:hover {
            background-color: #0056b3;
        }

        /* Modal Overlay Base */
        .modalFAQoverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 999;
        }

        /* Modal Box Base */
        .modalFAQbox {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            position: relative;
            width: 90%;
            max-width: 800px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        /* Responsive Media Containers */
        .mediaFAQcontainer {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
        }
        .pdfFAQcontainer {
            position: relative;
            width: 100%;
            height: 70vh; /* Taller container for reading PDFs */
        }
        .mediaFAQcontainer iframe, 
        .mediaFAQcontainer video,
        .pdfFAQcontainer iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Close Button */
        .modalFAQclose {
            position: absolute;
            top: -40px;
            right: 0;
            color: #fff;
            text-decoration: none;
            font-size: 30px;
            font-family: sans-serif;
        }

        /* CSS :target Magic (Triggers when anchor matches ID) */
        .modalFAQoverlay:target {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <!-- Trigger Buttons -->
    <div class="btnFAQcontainer">
        <a href="#videoModal" class="modalFAQtrigger">Open Video Modal</a>
    </div>
</body>
<div class="faqModalsAll">
    <!-- Video Modal -->
    <div id="videoModal" class="modalFAQoverlay">
        <div class="modalFAQbox">
            <a href="#" class="modalFAQclose">&times;</a>
            <div class="mediaFAQcontainer">
                <!-- Replace this later -->
                    <iframe width="560" height="315" src="https://www.youtube.com/embed/1ev-sZUBZwA?si=Gh4p4akunLOM_4l5&amp;controls=0" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>
        </div>
    </div>
</div>

</html>
