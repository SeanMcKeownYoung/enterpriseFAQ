<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3x3 Grid Layout</title>
    <style>
        /* Centering the entire grid structure on the screen */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
  background-color: #ece9e1;
            font-family: sans-serif;
        }

        /* The main container holding the 9 boxes */
        .grid-container {
            display: grid;
            /* Creates 3 columns of equal, flexible width */
            grid-template-columns: repeat(3, 1fr); 
            /* Creates 3 rows of equal, flexible height */
            grid-template-rows: repeat(2, 1fr); 
            /* Adds spacing/gap between the boxes */
            width: 450px;
            height: 300px;
        }

        /* Styling applied to each individual box */
        .box {
            background-color: #969491;
  color: transparent;
            font-size: 24px;
            font-weight: bold;
            /* Centers text content perfectly inside each box */
            display: flex;
            justify-content: center;
            align-items: center;

        }
main {
    display: flex;
    flex-direction: column;
    gap: 30px;
}

            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);}
