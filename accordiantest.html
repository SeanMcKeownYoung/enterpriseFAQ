
<style>
    /* Core Layout */
.faqEXTRA {
  max-width: 600px;
  margin: 0 auto;
  font-family: sans-serif;
  border: 1px solid #ddd;
  background-color: aqua;
  border-radius: 4px;
}

.faqEXTRAitem {
  border-bottom: 1px solid #ddd;
}

.faqEXTRAitem:last-child {
  border-bottom: none;
}

/* Hide the native checkbox visually but keep it accessible */
.faqEXTRAtoggle {
  position: absolute;
  opacity: 0;
  z-index: -1;
}

/* Header/Trigger Styling */
.faqEXTRAheader{
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #ff0000;
  cursor: pointer;
  user-select: none;
}


.faqEXTRAheader::after {
  content: "";
  font-size: 22px;
  transition: transform 0.3s ease;
}

/* Content Area (Hidden by default using grid-template-rows animation trick) */
.faqEXTRAcontent {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 0.3s ease;
  overflow: hidden;
  background: #fff;
}

/* Inner wrapper needed for the CSS grid height transition trick */
.faqEXTRAcontent div {
  min-height: 0;
  padding: 0 20px;
  margin: 0;
  opacity: 0;
  transition: opacity 0.2s ease, padding 0.3s ease;
}

/* Active/Opened State via :checked Sibling Selectors */
.faqEXTRAtoggle:checked ~ .faqEXTRAheader::after {
  content: "\2715";
  font-size: 22px;
  transition: transform 0.3s ease;
}

.faqEXTRAtoggle:checked ~ .faqEXTRAcontent {
  grid-template-rows: 1fr; /* Animates the grid wrapper to auto height */
}

.faqEXTRAtoggle:checked ~ .faqEXTRAcontent div {
  padding: 15px 20px;
  opacity: 1;
}
.faqEXTRAcontent video {
width: 100%;
aspect-ratio: 1 / 0.5625;
}
</style>

<div class="faqEXTRA">
  <!-- Item 1 -->
  <div class="faqEXTRAitem">
    <input type="checkbox" id="faqEXTRA-1" class="faqEXTRAtoggle">
    <label for="faqEXTRA-1" class="faqEXTRAheader">What is a pure CSS faqEXTRA?</label>
    <div class="faqEXTRAcontent">
      <div>
        <p>It is a collapsible content menu built entirely using HTML and CSS, without relying on JavaScript code.</p>
        <video controls poster="thumbnail.jpg">
            <source src="movie.mp4" type="video/mp4" loading="lazy">
        </video>
      </div>

    </div>
  </div>

  <!-- Item 2 -->
  <div class="faqEXTRAitem">
    <input type="checkbox" id="faqEXTRA-2" class="faqEXTRAtoggle">
    <label for="faqEXTRA-2" class="faqEXTRAheader">How does the checkbox hack work?</label>
    <div class="faqEXTRAcontent">
      <p>Clicking the label toggles the hidden checkbox. CSS detects this state using the :checked pseudo-class to reveal the adjacent content div.</p>
    </div>
  </div>
</div>
